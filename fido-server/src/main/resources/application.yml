server:
  port: 8443

spring:
  application:
    name: fido-server
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# ---------------------------------------------------------------------------
# 本專案自訂設定。目前 persistence 層為 in-memory 骨架（devops-engineer 建置
# SQL Server 後，將 com.fido.server.repository.inmemory.* 換成 JPA/JDBC 實作，
# 本設定檔可望不需大改）。
# ---------------------------------------------------------------------------
fido:
  challenge:
    ttl-seconds: 60           # 對齊 CLAUDE.md：Challenge 60 秒時效
  session-jwt:
    issuer: "https://fido.example.internal"   # 對應 JWT claim `iss`（【本文件補充決策 D4/D5 對應設定值】）
    ttl-seconds: 120           # 對齊 CLAUDE.md / api-contract.md D5：exp = iat + 120s
    kid: "2026-fido-1"         # JWKS 對應的 key id；金鑰輪替時新增而非直接覆蓋
  rate-limit:
    default-tps: 100           # 對齊 CLAUDE.md 峰值容量目標；租戶可於 tenants.rate_limit_tps 覆寫
  attestation:
    # 【重要】以下為「介面卡」骨架的可調參數，非真實密碼學驗證結果。
    # 真正的 Android Key Attestation 憑證鏈驗證與 attStmt 簽章驗證尚未實作，
    # 詳見 com.fido.server.webauthn 套件內每個 Stub* 類別的 Javadoc。
    stub:
      chain-valid: true
      default-security-level: STRONG_BOX   # STRONG_BOX / TEE / SOFTWARE（設 SOFTWARE 可測試 422 HARDWARE_SECURITY_NOT_MET 分支）
  dev-seed:
    enabled: true
    tenant-name: "Demo Shop"
    rp-id: "shop.example.com"
    expected-origin: "https://shop.example.com"
    # 開發用固定 API Key，僅用於骨架本機測試；正式環境由 devops-engineer 建置時另行核發並移除此區塊。
    api-key: "dev-api-key-00000000000000000000"

logging:
  level:
    com.fido.server: INFO
