server:
  port: 8443

spring:
  application:
    name: fido-server
  jackson:
    default-property-inclusion: non_null
  # ---------------------------------------------------------------------------
  # Persistence（正式部署預設路徑）：獨立 SQL Server 實例（見 CLAUDE.md），僅在
  # fido.persistence.mode=jpa（下方預設值）時才會實際生效（見
  # com.fido.server.config.JpaInfrastructureConfig）。
  #
  # 下列 datasource 連線資訊皆為【佔位值】，devops-engineer 建置正式/測試 SQL Server 環境後，
  # 務必以實際主機、帳密（建議走環境變數或密碼管理工具，不要把正式密碼寫回這個檔案並進版控）
  # 覆寫。本機開發若沒有可連線的 SQL Server，請改用 fido.persistence.mode=memory（純
  # in-memory，見 com.fido.server.repository.inmemory）或本專案測試用的 H2 profile（僅存在於
  # src/test/resources/application-h2.yml，不會出現在正式部署路徑）。
  # ---------------------------------------------------------------------------
  datasource:
    url: "jdbc:sqlserver://REPLACE_WITH_SQLSERVER_HOST:1433;databaseName=FidoServerDb;encrypt=true;trustServerCertificate=false"
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: "REPLACE_WITH_DB_USERNAME"
    password: "REPLACE_WITH_DB_PASSWORD"
  jpa:
    open-in-view: false
    hibernate:
      # validate（非 create/update）：只驗證 entity 與已存在 schema 是否一致，schema 本身
      # 一律以 infra/sql/002_create_tables.sql（權威 DDL）為準，不讓 Hibernate 自動產生/修改。
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# ---------------------------------------------------------------------------
# 本專案自訂設定。
# ---------------------------------------------------------------------------
fido:
  persistence:
    # jpa（預設，對齊 CLAUDE.md「獨立 SQL Server 實例」）：啟用
    # com.fido.server.repository.jpa.*，實際連線的資料庫由上方 spring.datasource.* 決定。
    # memory：啟用 com.fido.server.repository.inmemory.*（不建立任何 DataSource），僅供
    # 本機開發/測試骨架使用，正式部署不應設為 memory。
    mode: jpa
  challenge:
    ttl-seconds: 60           # 對齊 CLAUDE.md：Challenge 60 秒時效
  session-jwt:
    issuer: "https://fido.example.internal"   # 對應 JWT claim `iss`（【本文件補充決策 D4/D5 對應設定值】）
    ttl-seconds: 120           # 對齊 CLAUDE.md / api-contract.md D5：exp = iat + 120s
    kid: "2026-fido-1"         # JWKS 對應的 key id；金鑰輪替時新增而非直接覆蓋
  rate-limit:
    default-tps: 100           # 對齊 CLAUDE.md 峰值容量目標；租戶可於 tenants.rate_limit_tps 覆寫
  attestation:
    # real（預設）：Attestation statement 簽章、Android Key Attestation 憑證鏈（含內建
    # Google 官方 root 信任集合）、Assertion 簽章一律使用真實密碼學驗證。
    # stub：切回骨架 stub（見 com.fido.server.webauthn 套件內每個 Stub* 類別），僅供測試
    # 環境使用，正式部署不應設為 stub。
    mode: real
    # 以下設定僅在 mode=stub 時才會生效。
    stub:
      chain-valid: true
      default-security-level: STRONG_BOX   # STRONG_BOX / TEE / SOFTWARE（設 SOFTWARE 可測試 422 HARDWARE_SECURITY_NOT_MET 分支）
    # 【PoC 專用，與上面的 mode 完全獨立】mode 控制「要不要做真實密碼學驗證」；poc-trust
    # 控制「除了內建 Google 官方 root，要不要額外信任一組指定路徑下的測試 root」。預設
    # enabled=false：正式部署路徑不受影響，只信任內建 Google 官方 root。僅在 Android
    # 模擬器等沒有真正硬體、其 Key Attestation 憑證鏈鏈到自產測試 root 的 PoC 情境才需要
    # 開啟（見 docs/android-poc-checklist.md 附錄 A-3、CLAUDE.md）。extra-roots-location
    # 預設指向 production classpath 之外的外部檔案路徑，避免 PoC 測試 root 被誤植入部署產物。
    poc-trust:
      enabled: false
      extra-roots-location: "file:./poc-trust-roots/*.pem"
  dev-seed:
    enabled: true
    tenant-name: "Demo Shop"
    rp-id: "shop.example.com"
    expected-origin: "https://shop.example.com"
    # 開發用固定 API Key，僅用於骨架本機測試；正式環境由 devops-engineer 建置時另行核發並移除此區塊。
    api-key: "dev-api-key-00000000000000000000"

logging:
  level:
    com.fido.server: INFO
